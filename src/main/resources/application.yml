spring:
  application:
    name: Bank Service
  security:
    user:
      name: admin
      password: admin123
      roles: ADMIN
  datasource:
    url: jdbc:h2:mem:bankdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    secret: secret-key
    expiration-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logbook:
  exclude:
    - /actuator/**
    - /swagger-ui/**
    - /v3/api-docs/**
  obfuscate:
    headers:
      - Authorization
      - Set-Cookie
  strategy: body-only-if-status-at-least
  minimum-status: 400
