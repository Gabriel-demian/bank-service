spring:
  application:
    name: Bank Service
  security:
    user:
      name: admin
      password: admin123
      roles: ADMIN
  datasource:
    url: jdbc:h2:mem:bankdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

security:
  jwt:
    secret: secret-key